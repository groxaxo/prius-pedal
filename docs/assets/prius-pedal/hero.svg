<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title description">
  <title id="title">Prius Pedal Lab</title>
  <desc id="description">A dark blue project banner with mint lettering, a stylized fourth-generation Prius hatchback, and labels for the 2016 Prius, Toyota Safety Sense P, comma 3X, Pedal and Smart DSU. Development candidate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142b39"/>
      <stop offset="1" stop-color="#0b1723"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f1f6f0"/>
      <stop offset="0.5" stop-color="#cddfd9"/>
      <stop offset="1" stop-color="#87aaa5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d7782"/>
      <stop offset="1" stop-color="#193545"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#78aaac" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1440" height="560" rx="26" fill="url(#background)"/>
  <rect width="1440" height="560" rx="26" fill="url(#grid)"/>
  <circle cx="1160" cy="260" r="240" fill="#53d6b0" opacity="0.035"/>
  <circle cx="1160" cy="260" r="164" fill="none" stroke="#7be3c3" stroke-opacity="0.07"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <path d="M64 64h30" stroke="#80e8c4" stroke-width="4" stroke-linecap="round"/>
    <text x="110" y="72" fill="#99b7bd" font-size="21" font-weight="600" letter-spacing="3">2016 PRIUS / TSS-P</text>
    <text x="60" y="200" fill="#f5f5e9" font-size="100" font-weight="700" letter-spacing="-4">Prius</text>
    <text x="60" y="304" fill="#80e8c4" font-size="100" font-weight="700" letter-spacing="-4">Pedal Lab</text>
    <text x="66" y="365" fill="#bad0d0" font-size="25">A focused project for your Prius.</text>

    <g transform="translate(1052 44)">
      <rect width="328" height="44" rx="22" fill="#e8ba6d" fill-opacity="0.09" stroke="#e8ba6d" stroke-opacity="0.4"/>
      <circle cx="22" cy="22" r="4" fill="#e8ba6d"/>
      <text x="40" y="28" fill="#f0c884" font-size="16" font-weight="600" letter-spacing="1.5">DEVELOPMENT CANDIDATE</text>
    </g>

    <text x="820" y="153" fill="#8daeb5" font-size="16" letter-spacing="3">COMMA 3X + PEDAL + SMART DSU</text>
    <path d="M648 440H1380" stroke="#8bcdbb" stroke-opacity="0.26" stroke-width="2"/>
    <path d="M690 458h86m56 0h86m56 0h86m56 0h86m56 0h86" stroke="#8bcdbb" stroke-opacity="0.16" stroke-width="2"/>
    <ellipse cx="1040" cy="427" rx="293" ry="17" fill="#030c16" opacity="0.5"/>

    <!-- Stylized fourth-generation hatchback silhouette; no manufacturer emblem. -->
    <path d="M726 356l20-78 133-63q31-14 77-11l109 8 134 87 106 26q20 6 27 26l10 39-16 20h-52q-2-62-56-62t-57 62H904q-2-62-56-62t-56 62h-43l-22-19z" fill="url(#body)" stroke="#e5f1e7" stroke-width="2"/>
    <path d="M769 282l116-55q22-10 64-8l106 7 111 71-285-6z" fill="url(#glass)" stroke="#779998" stroke-width="2"/>
    <path d="M943 219l12 75m105-68 38 69" stroke="#d4e7df" stroke-width="8"/>
    <path d="M762 297l23 86m183-87 6 94m163-89-8 91" stroke="#527d7d" stroke-width="2" opacity="0.65" fill="none"/>
    <path d="M913 311h24m142 5h25" stroke="#2d555d" stroke-width="5" stroke-linecap="round"/>
    <path d="M774 325l-32-22-10 51 19 10 11-28z" fill="#e27c77"/>
    <path d="M1221 314l81 24-55 12-35-8z" fill="#f4fbdf" stroke="#8cabac" stroke-width="2"/>
    <path d="M1247 350l28 20-5 24" fill="none" stroke="#eaf8d9" stroke-width="5"/>
    <path d="M1016 340l-68 36h-41m109-36 172 20" fill="none" stroke="#accac2" stroke-width="3"/>
    <path d="M915 401h226" stroke="#2a4c57" stroke-width="7"/>
    <path d="M1287 386h42" stroke="#284a53" stroke-width="8"/>
    <g fill="#101f2b" stroke="#729994" stroke-width="3">
      <circle cx="848" cy="409" r="45"/>
      <circle cx="1218" cy="409" r="45"/>
    </g>
    <g fill="#bed5d0" stroke="#345560" stroke-width="5">
      <circle cx="848" cy="409" r="27"/>
      <circle cx="1218" cy="409" r="27"/>
    </g>
    <g stroke="#345560" stroke-width="4">
      <path d="M848 383v52m-26-26h52m326 0h36m-18-26v52"/>
      <path d="M830 391l36 36m-36 0 36-36m334 0 36 36m-36 0 36-36"/>
    </g>
    <g fill="#345560">
      <circle cx="848" cy="409" r="6"/>
      <circle cx="1218" cy="409" r="6"/>
    </g>

    <path d="M64 473H1376" stroke="#8bcdbb" stroke-opacity="0.2"/>
    <text x="66" y="517" fill="#91aeb5" font-size="18" letter-spacing="1">OFFICIAL 0.11.2 BASE</text>
    <circle cx="330" cy="511" r="3" fill="#557a81"/>
    <text x="352" y="517" fill="#91aeb5" font-size="18" letter-spacing="1">RELEASE-TIZI</text>
    <text x="1374" y="517" text-anchor="end" fill="#80e8c4" font-size="18" letter-spacing="1">OFF BY DEFAULT</text>
  </g>
</svg>
